<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026-05-14 Prompt to Action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdfcf8;
    --surface: #ffffff;
    --ink: #2c2a26;
    --ink-soft: #57534e;
    --accent: #5a3e1b;
    --accent-hover: #3d2a10;
    --rule: #e8e4dc;
    --code-bg: #f5f1e8;
    --shadow: 0 2px 16px rgba(60, 50, 30, 0.06);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', 'Noto Serif TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.8;
    font-size: 18px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 32px 96px;
  }

  header {
    text-align: center;
    margin-bottom: 56px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--rule);
  }

  .date-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 38px;
    color: var(--ink);
    margin: 0;
    letter-spacing: 0.02em;
  }

  section {
    margin-bottom: 40px;
  }

  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: block;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 24px 28px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 24px rgba(60, 50, 30, 0.08);
  }

  p {
    margin: 0;
  }

  p + p {
    margin-top: 12px;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  a:hover {
    color: var(--accent-hover);
    border-bottom-color: var(--accent-hover);
  }

  .link-title {
    font-size: 19px;
    font-weight: 500;
  }

  code {
    font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
    background-color: var(--code-bg);
    color: var(--ink);
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 14px;
    display: inline-block;
    margin-top: 8px;
    border: 1px solid var(--rule);
  }

  hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 40px 0;
  }

  .divider-ornament {
    text-align: center;
    margin: 40px 0;
    color: var(--rule);
    letter-spacing: 0.5em;
    font-size: 14px;
  }

  footer {
    margin-top: 72px;
    padding-top: 32px;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-size: 14px;
    color: var(--ink-soft);
  }

  @media (max-width: 600px) {
    .container {
      padding: 40px 20px 64px;
    }
    h1 {
      font-size: 28px;
    }
    body {
      font-size: 16px;
    }
    .card {
      padding: 20px;
    }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <span class="date-tag">2026 · 05 · 14</span>
    <h1>Prompt to Action</h1>
  </header>

  <section>
    <span class="section-label">課程資源</span>
    <div class="card">
      <p class="link-title"><a href="https://docs.google.com/presentation/d/1ImGc9Xvh5pYgDQaqMVGXmjEbvb2pR0xFCtHgbYqSFgs">📑 課程簡報</a></p>
    </div>
    <div class="card">
      <p class="link-title"><a href="https://github.com/CQD/20260514_prompt_to_action/">💻 Sample Code</a></p>
      <code>git clone https://github.com/CQD/20260514_prompt_to_action.git</code>
    </div>
  </section>

  <section>
    <span class="section-label">問卷回饋</span>
    <div class="card">
      <p class="link-title"><a href="https://docs.google.com/forms/d/e/1FAIpQLSfawnVuypvJ0r2M_hvmw_AFiQ_V5eSeb8ByLsYS_hzbv9fs9w/viewform">📝 課前問卷</a></p>
    </div>
    <div class="card">
      <p class="link-title"><a href="https://docs.google.com/forms/d/e/1FAIpQLSeQZPeOu6jQFtfz8CNbITBnoTVO535w70EsN8HOHNfb6a9u4w/viewform">✍️ 課後問卷</a></p>
    </div>
  </section>

  <section>
    <span class="section-label">主辦單位</span>
    <div class="card">
      <p class="link-title"><a href="https://ksda.tw/">🏛️ 高雄軟體開發者協會 — 首頁</a></p>
    </div>
    <div class="card">
      <p class="link-title"><a href="https://www.facebook.com/ksda.tw/about?locale=zh_TW">📘 高雄軟體開發者協會 — 粉絲專頁</a></p>
    </div>
  </section>

  <footer>
    「幫我美化 index.html，希望風格是明亮清晰，典雅好閱讀」
  </footer>

</div>
</body>
</html>
